name: CI

# Everything that is not a release: the suite on every supported Python, a real
# image build and a smoke test of the built container.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Version
        run: python --version

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: tf-registry-proxy:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Run the suite inside the test image
        run: |
          docker build --target test -t tf-registry-proxy:test .
          docker run --rm tf-registry-proxy:test

      - name: Smoke test /healthz
        run: |
          docker run -d --name tfproxy -p 8080:8080 \
            -e TFP_BACKENDS=fs tf-registry-proxy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8080/.well-known/terraform.json
          echo
          docker logs tfproxy
          docker rm -f tfproxy
